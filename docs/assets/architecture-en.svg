<svg width="1120" height="334" viewBox="0 0 1120 334" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Runtime structure: control panel, desktop host and resident core">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9b9cd"/>
    </marker>
    <linearGradient id="corebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e6eefc"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="334" fill="#ffffff"/>

  <g transform="translate(45 22)">
    <rect x="0" y="0" width="270" height="170" rx="16" fill="#ffffff" stroke="#e2e9f3"/>
    <text x="24" y="38" font-family="'Segoe UI Semibold','Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#0d1a2b">Control panel</text>
    <text x="24" y="60" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa9bd" letter-spacing=".4">React · TypeScript · WebView2</text>
    <text x="24" y="96" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Opens on demand</text>
    <text x="24" y="124" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Never touches hardware</text>
    <text x="24" y="152" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Failures shown as-is</text>
    <rect x="380" y="0" width="270" height="170" rx="16" fill="#ffffff" stroke="#e2e9f3"/>
    <text x="404" y="38" font-family="'Segoe UI Semibold','Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#0d1a2b">Desktop host</text>
    <text x="404" y="60" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa9bd" letter-spacing=".4">C# · WinForms · WebView2</text>
    <text x="404" y="96" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Origin + allowlist</text>
    <text x="404" y="124" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">No shell or filesystem</text>
    <text x="404" y="152" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Waits for in-flight work</text>
    <rect x="760" y="0" width="270" height="170" rx="16" fill="url(#corebg)" stroke="#cfdef5"/>
    <text x="784" y="38" font-family="'Segoe UI Semibold','Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#0d1a2b">Resident core</text>
    <text x="784" y="60" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7d93b3" letter-spacing=".4">C# · .NET 10</text>
    <text x="784" y="96" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#44597a">Owns the device handles</text>
    <text x="784" y="124" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#44597a">Serialized, with timeouts</text>
    <text x="784" y="152" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#44597a">Revision check on save</text>

    <line x1="274" y1="85" x2="370" y2="85" stroke="#a9b9cd" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="322" y="68" text-anchor="middle" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">JSON</text>
    <line x1="654" y1="85" x2="750" y2="85" stroke="#a9b9cd" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="702" y="68" text-anchor="middle" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">Named pipe</text>

    <line x1="895" y1="178" x2="895" y2="210" stroke="#a9b9cd" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="907" y="198" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">DDC/CI · WMI</text>

    <rect x="760" y="218" width="128" height="72" rx="14" fill="#ffffff" stroke="#e2e9f3"/>
    <text x="780" y="248" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#0d1a2b">External</text>
    <text x="780" y="272" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">Brightness/color</text>
    <rect x="900" y="218" width="128" height="72" rx="14" fill="#ffffff" stroke="#e2e9f3"/>
    <text x="920" y="248" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#0d1a2b">Internal</text>
    <text x="920" y="272" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">Brightness only</text>

    <rect x="0" y="218" width="270" height="72" rx="14" fill="#fbfcfe" stroke="#e8eef7" stroke-dasharray="4 4"/>
    <text x="24" y="248" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#54657d">Config + startup here</text>
    <text x="24" y="272" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8798ad">One entry, self-contained</text>
  </g>
</svg>
